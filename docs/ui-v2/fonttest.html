<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Heebo:wght@500;700;900&family=Assistant:wght@600;700;800&family=Varela+Round&family=Alef:wght@700&family=Secular+One&family=Noto+Sans+Hebrew:wght@700;900&family=Fredoka:wght@600;700&family=Baloo+2:wght@700;800&family=Rubik+Mono+One&display=swap" rel="stylesheet">
