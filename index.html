<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>קוֹרְאִים עִם פַּנְדָּה 🐼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* ===== UI v2 · Direction A "Duo Clean" (tokens from docs/ui-v2/mock-a.html) ===== */
:root{
  --green:#58CC02;--green-d:#46A302;--green-l:#D7FFB8;
  --blue:#1CB0F6;--blue-d:#1899D6;--blue-l:#DDF4FF;
  --gold:#FFC800;--gold-d:#E5A800;
  --ink:#3C3C3C;--ink2:#777;--line:#E5E5E5;--grey:#AFAFAF;--bg:#FFFFFF;
  --red:#FF4B4B;--purple:#CE82FF;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:'Rubik',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
body{overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;z-index:1;background:var(--bg)}
.screen.on{display:flex}

/* ---- 3D buttons ---- */
.b3{border-radius:16px;font-weight:900;font-size:19px;padding:0 18px;height:58px;display:inline-flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.01em;border-bottom:4px solid rgba(0,0,0,.18);line-height:1;transition:transform .06s}
.b3:active{transform:translateY(3px);border-bottom-width:1px;margin-bottom:3px}
.b3.primary{background:var(--green);color:#fff;border-bottom-color:var(--green-d)}
.b3.blue{background:var(--blue);color:#fff;border-bottom-color:var(--blue-d)}
.b3.ghost{background:#fff;color:var(--blue);border:2px solid var(--line);border-bottom:4px solid var(--line)}
.b3.ghost:active{border-bottom-width:2px;margin-bottom:2px}
.b3.big{height:64px;font-size:22px;border-radius:18px;width:100%}

/* ---- bubble (tail points at the panda on its left) ---- */
.bubble{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 14px;font-weight:700;font-size:18px;line-height:1.5;position:relative}
.bubble:after{content:"";position:absolute;left:-9px;bottom:18px;width:14px;height:14px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}

/* ================= HOME ================= */
#s-start{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(10px + var(--sat)) 0 calc(112px + var(--sab))}
.wrap{width:100%;max-width:560px;padding:0 18px}
#topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:2px}
.avatar{display:inline-flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-bottom-width:3px;border-radius:999px;padding:4px 12px 4px 6px;font-weight:700;font-size:15px;max-width:42%;min-width:0}
.avatar .em{width:30px;height:30px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-size:17px;flex:none}
.avatar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statpill{display:inline-flex;align-items:center;gap:10px;background:#FFF8E0;border:2px solid #FFE6A0;border-radius:999px;padding:6px 14px;font-weight:900;font-size:16px;color:#8a6a00;white-space:nowrap;direction:rtl}
.statpill b{color:var(--ink)}
.statpill .sep{width:2px;height:16px;background:#FFE6A0}
.gear{width:42px;height:42px;border:2px solid var(--line);border-bottom-width:3px;border-radius:12px;display:grid;place-items:center;color:var(--grey);font-size:22px;flex:none;line-height:1}
#hero{display:flex;align-items:flex-end;gap:10px;padding-top:10px;height:168px;cursor:pointer}
#hero img{height:150px;flex:none;filter:drop-shadow(0 6px 0 rgba(0,0,0,.06));animation:bob 2.8s ease-in-out infinite}
#hero .bubble{flex:1;margin-bottom:50px}
.lbl{font-size:15px;font-weight:900;color:#8F8F8F;letter-spacing:.04em;margin:18px 0 8px;display:flex;align-items:center;justify-content:space-between}
.lbl .lnk{font-size:15px;font-weight:700;color:var(--blue);letter-spacing:0}
.card{width:100%;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:12px;display:flex;align-items:center;gap:12px;text-align:right}
.card.sel{border-color:var(--green);background:var(--green-l)}
.card .cv{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none;background:var(--line);display:grid;place-items:center;font-size:30px}
.card .t{font-weight:900;font-size:19px;line-height:1.35}
.card .s{font-size:14px;color:var(--ink2);margin-top:2px;font-weight:500}
.pbar{height:12px;background:#fff;border-radius:99px;overflow:hidden;margin-top:8px;border:0}
.card:not(.sel) .pbar{background:var(--line)}
.pbar i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .4s}
.parts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.part{background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:7px 6px 7px;text-align:center;font-weight:900;font-size:16px;min-width:0}
.part .thumb,.part .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;margin-bottom:5px;display:block}
.part .ph{background:var(--blue-l);color:var(--blue-d);display:grid;place-items:center;font-size:26px}
.part .chk{font-size:13px;font-weight:700;min-height:18px;line-height:18px;color:var(--grey)}
.part.done{border-color:var(--gold)}
.part.done .chk{color:#c98f00}
.part.sel{border-color:var(--green);background:var(--green-l)}
.part.sel .chk{color:var(--green-d)}
.part.all{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;font-size:16px}
.part.all .chk{min-height:0}
.seg{display:flex;background:#fff;border:2px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;border-radius:12px;min-height:48px;font-weight:900;font-size:15px;color:var(--ink2);padding:4px 6px;line-height:1.25;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.seg button.sel{background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-d)}
.seg .em{font-size:18px;line-height:1}
@media (max-width:420px){#modes button{flex-direction:column;gap:2px;font-size:14px;min-height:56px}}
#gowrap{position:fixed;left:0;right:0;bottom:0;padding:14px 18px calc(16px + var(--sab));background:linear-gradient(rgba(255,255,255,0),#fff 28%);display:none;justify-content:center;z-index:3;pointer-events:none}
#s-start.on ~ #gowrap{display:flex}
#go{pointer-events:auto;max-width:524px;white-space:nowrap}

/* ---- settings sheet ---- */
#sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(60,60,60,.45);align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet .in{background:#fff;width:100%;max-width:600px;max-height:92dvh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
#sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px;border-bottom:2px solid var(--line)}
#sheet .hd h3{margin:0;font-size:20px;font-weight:900}
#sheet .x{width:40px;height:40px;font-size:22px;color:var(--grey);font-weight:900}
#sheet .bd{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 18px 12px;flex:1;min-height:0}
#sheet .ft{padding:10px 18px calc(14px + var(--sab));border-top:2px solid var(--line)}
#sheet .lbl{margin-top:16px}
input[type=text],textarea{font-family:inherit;font-weight:500;font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);width:100%;background:#F7F7F7;color:var(--ink);user-select:text;-webkit-user-select:text}
input[type=text]:focus,textarea:focus{outline:0;border-color:var(--blue);background:#fff}
input::placeholder,textarea::placeholder{color:var(--grey)}
textarea{height:150px;resize:vertical;line-height:1.7}
#gender{margin-top:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px;font-size:17px;font-weight:500;min-height:54px;border-top:2px solid #F2F2F2}
.toggle:first-child{border-top:0}
.toggle input{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0}
.toggle input:after{content:"";position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.12);transition:right .15s}
.toggle input:checked{background:var(--green)}
.toggle input:checked:after{right:23px}
.tlist{display:flex;flex-direction:column;gap:8px}
.tcard{position:relative}
.tcard .del{margin-inline-start:auto;font-size:18px;padding:6px;flex:none}
#add{width:100%;margin-top:10px;color:var(--green-d);border:2px dashed var(--green);border-radius:16px;min-height:52px;font-weight:900;font-size:17px}
#addbox{display:none;margin-top:10px}
#save-text{width:100%;margin-top:8px}

/* ================= READ ================= */
#s-read{height:100dvh;padding:0}
#top{width:100%;max-width:1100px;padding:calc(6px + var(--sat)) 16px 0;height:calc(54px + var(--sat));display:flex;align-items:center;gap:12px;flex:none}
#home{width:40px;height:40px;display:grid;place-items:center;font-size:24px;color:var(--grey);font-weight:900;flex:none}
#track{flex:1;height:18px;background:var(--line);border-radius:99px;position:relative}
#fill{position:absolute;top:0;bottom:0;right:0;width:0;background:var(--green);border-radius:99px;transition:width .4s}
#fill:after{content:"";position:absolute;left:10px;right:10px;top:4px;height:4px;border-radius:99px;background:rgba(255,255,255,.35)}
#rocket{position:absolute;top:50%;right:0;font-size:28px;line-height:1;transform:translate(50%,-50%);transition:right .4s}
#trophy{font-size:26px;line-height:1;flex:none}
#stars{font-weight:900;font-size:17px;color:var(--ink);flex:none;min-width:52px;text-align:center;white-space:nowrap}
#microw{flex:none;display:flex;justify-content:center;width:100%;padding:0 16px}
#mic{display:none;margin-top:8px;background:#fff;border:2px solid var(--line);border-radius:99px;padding:5px 14px 5px 10px;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--ink2);max-width:100%}
#mic .dot{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px #ffd6d6;flex:none;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
#stage{flex:1;width:100%;max-width:1100px;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);padding:4px 16px 0}
#cardwrap{grid-row:1;grid-column:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:0;width:100%}
#card{width:100%;background:#fff;border:2px solid var(--line);border-bottom-width:5px;border-radius:24px;padding:12px 8px 10px;text-align:center;cursor:pointer;flex:none}
#card:active{transform:translateY(2px)}
#word{font-weight:900;line-height:1.65;letter-spacing:.02em;display:flex;gap:.03em;direction:rtl;justify-content:center;white-space:nowrap}
#word{flex-wrap:wrap;align-items:baseline}
#word .br{flex-basis:100%;height:0}
#word.split{line-height:1.6}
#word.pop{animation:pop .45s}
.syl{padding:0 .06em .16em;border-radius:.15em;position:relative;color:var(--ink);transition:color .2s,background .2s}
.syl.past{color:var(--green)}
.syl.fut{color:#B9B9B9}
.syl.now{color:var(--ink);background:var(--green-l)}
.syl.now:after{content:"";position:absolute;left:8%;right:8%;bottom:.035em;height:.065em;border-radius:99px;background:var(--green)}
.colored .syl.c0{color:var(--ink)}.colored .syl.c1{color:var(--blue-d)}
.colored .syl.now{color:var(--ink)}
.word-done .syl{color:var(--green)!important;background:none!important}
.word-done .syl:after{display:none}
.punct{color:var(--grey)}
#wcount{color:#8F8F8F;font-weight:700;font-size:14px;margin-top:8px}
#ctx{display:none;font-size:19px;line-height:1.7;color:var(--ink2);text-align:center;font-weight:500;max-width:760px;flex:none}
#ctx .w.r{color:var(--grey)}
#ctx .w.c{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--green);text-underline-offset:6px;text-decoration-thickness:3px}
#heard{font-size:16px;color:var(--ink2);font-weight:700;background:#F7F7F7;border-radius:12px;padding:7px 14px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;min-height:36px}
#heard:empty{visibility:hidden}
#s-read:not(.micmode) #heard{display:none}
#buddy{grid-row:2;grid-column:1;display:flex;align-items:flex-end;gap:8px;width:100%;height:clamp(104px,19dvh,170px);padding-bottom:8px;pointer-events:none}
#buddy img{height:100%;flex:none;animation:bob 3s ease-in-out infinite;transform-origin:bottom center}
#buddy img.jump{animation:jump .6s}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px) rotate(-5deg)}}
#say{flex:1 1 auto;max-width:340px;margin-bottom:clamp(36px,7dvh,56px);font-size:18px;padding:9px 14px;opacity:0;transform:scale(.7);transform-origin:left bottom;transition:opacity .2s,transform .2s}
#say.show{opacity:1;transform:scale(1)}
#say:empty{visibility:hidden}
#scene{display:none;width:100%;border-radius:20px;border:2px solid var(--line);border-bottom-width:5px;cursor:pointer;object-fit:cover}
#controls{flex:none;width:100%;display:grid;grid-template-columns:64px 64px 1fr;gap:10px;padding:10px 16px calc(14px + var(--sab));border-top:2px solid var(--line);background:#fff}
#controls.nohelp{grid-template-columns:64px 1fr}
#controls .b3{height:64px;font-size:24px;padding:0}
#next{font-size:24px}
#help.nudge{animation:wig 1s infinite}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@media (max-height:700px){#buddy{height:clamp(92px,16dvh,130px)}#controls .b3{height:58px}#controls{padding-top:8px}#ctx{font-size:17px}}
/* iPad / desktop: scene | word | panda */
@media (min-width:900px){
  #stage{grid-template-columns:minmax(180px,22vw) minmax(0,1fr) minmax(180px,20vw);grid-template-rows:minmax(0,1fr);gap:20px;padding:12px 24px 12px}
  #scene.on{display:block;grid-column:1;grid-row:1;align-self:center;max-height:60dvh}
  #cardwrap{grid-column:2;grid-row:1}
  #buddy{grid-column:3;grid-row:1;height:100%;flex-direction:column;align-items:center;justify-content:center;padding-bottom:0}
  #buddy img{height:auto;width:min(100%,200px);max-height:min(34dvh,220px)}
  #say{flex:none;width:auto;max-width:100%;margin-bottom:14px;transform-origin:center bottom;text-align:center}
  #say.bubble:after{left:50%;bottom:-9px;margin-left:-7px;transform:rotate(-45deg)}
  #controls{grid-template-columns:1fr 72px 72px minmax(260px,420px) 1fr}
  #controls.nohelp{grid-template-columns:1fr 72px minmax(260px,420px) 1fr}
  #back{grid-column:2}#help{grid-column:3}#next{grid-column:4}
  #controls.nohelp #next{grid-column:3}
  .wrap{max-width:720px}
}
@media (min-width:900px) and (max-height:900px){.part .thumb,.part .ph{aspect-ratio:4/3}#hero{height:150px}#hero img{height:136px}}

/* ---- particles / overlays ---- */
.p{position:fixed;pointer-events:none;font-size:28px;z-index:12}
#big,#intro{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(60,60,60,.55);padding:24px;text-align:center}
#big{z-index:10}#intro{z-index:11;cursor:pointer}
#big.on,#intro.on{display:flex}
.conf{position:absolute;left:0;right:0;top:0;height:60%;pointer-events:none;background-image:radial-gradient(circle,var(--gold) 4px,transparent 5px),radial-gradient(circle,var(--green) 4px,transparent 5px),radial-gradient(circle,var(--blue) 4px,transparent 5px),radial-gradient(circle,var(--purple) 4px,transparent 5px);background-size:120px 160px,150px 130px,170px 190px,140px 150px;background-position:10px 40px,60px 90px,100px 20px,30px 140px;opacity:.9}
.mcard{position:relative;background:#fff;border-radius:28px;padding:10px 20px 24px;width:100%;max-width:420px;box-shadow:0 10px 0 rgba(0,0,0,.22);animation:pop .5s}
#big .mcard img{height:min(230px,30dvh);margin-top:max(-130px,-17dvh);filter:drop-shadow(0 8px 0 rgba(0,0,0,.08))}
#big .t{font-size:34px;font-weight:900;line-height:1.3;margin-top:6px}
#big .sub{font-size:18px;color:var(--ink2);font-weight:700;margin-top:6px;line-height:1.5}
.xp{display:inline-flex;gap:8px;align-items:center;background:#FFF4C2;color:#8a6a00;border-radius:999px;padding:8px 18px;font-weight:900;font-size:20px;margin-top:14px;direction:ltr}
#intro .mcard{padding:14px 14px 18px;display:flex;flex-direction:column;align-items:center;gap:12px}
#intro img.sc{width:100%;max-height:44dvh;object-fit:cover;border-radius:18px;display:block}
#intro .row2{display:flex;align-items:flex-end;gap:8px;width:100%;justify-content:center}
#intro .pz{height:min(120px,16dvh);flex:none}
#intro .go{background:var(--green);color:#fff;border:0;border-bottom:4px solid var(--green-d);font-weight:900;font-size:22px;padding:12px 18px;margin-bottom:18px}
#intro .go:after{background:var(--green);border-color:var(--green-d)}

/* ================= FINISH ================= */
#s-end{overflow-y:auto;padding:calc(14px + var(--sat)) 0 calc(16px + var(--sab))}
#s-end .wrap{display:flex;flex-direction:column;align-items:center;text-align:center;margin:auto 0}
#end-title{font-size:30px;font-weight:900;margin:4px 0 0;line-height:1.3}
#end-body{width:100%;display:flex;flex-direction:column;align-items:center}
#end-body .tro{height:clamp(130px,25dvh,210px);margin-top:6px;animation:pop .6s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:12px}
.stat{background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:12px 8px;text-align:center}
.stat .v{font-size:28px;font-weight:900;line-height:1.2;direction:ltr}
.stat .l{font-size:14px;color:var(--ink2);font-weight:700;margin-top:4px;line-height:1.4}
.stat.green .v{color:var(--green-d)}.stat.gold .v{color:#c98f00}.stat.blue .v{color:var(--blue-d)}
.parent{font-size:13px;line-height:1.6;color:var(--grey);margin-top:12px;font-weight:500}
.fincta{display:grid;grid-template-columns:64px 1fr;gap:10px;width:100%;padding-top:14px}
.fincta .b3{height:64px;font-size:22px;padding:0}
</style>
</head>
<body>

<!-- HOME -->
<section id="s-start" class="screen on">
  <div class="wrap">
    <div id="topbar">
      <button class="avatar" id="avatar"><span class="em" id="av-em">👦</span><span class="nm" id="av-name"></span></button>
      <div class="statpill"><span>🔥 <b id="streak-n">0</b></span><span class="sep"></span><span>⭐ <b id="xp-n">0</b></span></div>
      <button class="gear" id="gear" aria-label="הַגְדָּרוֹת">⚙︎</button>
    </div>
    <div id="hero"><div class="bubble" id="hero-say" data-m="שָׁלוֹם! בּוֹא נִקְרָא יַחַד! ⚽" data-f="שָׁלוֹם! בּוֹאִי נִקְרָא יַחַד! ⚽">שָׁלוֹם! בּוֹא נִקְרָא יַחַד! ⚽</div><img src="img/panda/wave.webp" alt=""></div>
    <div class="lbl"><span>הַסֵּפֶר שֶׁלִּי</span><button class="lnk" id="change-text">📚 סֵפֶר אַחֵר</button></div>

// ---------- RENDER ----------
let FS=0;
function computeFS(){
  // one size for the whole part, sized by its longest word, so words never jump in size.
  // fit both the card width and the card lane height (no scrolling on the reading screen)
  const wrap=$('cardwrap');const cw=$('card').clientWidth||wrap.clientWidth||window.innerWidth,chh=wrap.clientHeight||window.innerHeight*.4;
  // reserve room in the card lane for: card padding/border + word counter, sentence (up to 3 lines), heard pill
  const reserve=52+(opts.ctx?3*Math.round(19*1.7)+12:0)+($('s-read').classList.contains('micmode')?48:0);
  const base=Math.min(window.innerWidth*.25,150,Math.max(40,(chh-reserve)/1.65));
  const avail=cw-28; // card padding + border
  const m=document.createElement('div');m.id='measure';m.style.cssText=`position:absolute;visibility:hidden;white-space:nowrap;font-family:Rubik,system-ui,sans-serif;font-weight:900;letter-spacing:.02em;font-size:${base}px`;
  document.body.appendChild(m);
  // per syllable: pill padding .12em + gap .03em
  const wid=(t,n)=>{m.textContent=t;return m.scrollWidth+(n+1)*base*.16};
  let max1=0,max2=0,hasSplit=false;
  for(const w of W){
    max1=Math.max(max1,wid(w.pre+w.syl.join('')+w.post,w.syl.length));
    const k=splitAt(w);
    if(k<0)max2=Math.max(max2,wid(w.pre+w.syl.join('')+w.post,w.syl.length));
    else{hasSplit=true;max2=Math.max(max2,wid(w.pre+w.syl.slice(0,k+1).join(''),k+1),wid(w.syl.slice(k+1).join('')+w.post,w.syl.length-k-1))}
  }
  m.remove();
  const fit=(mx,b)=>Math.max(36,Math.min(b,Math.floor(base*avail/Math.max(mx,1))));
  const fs1=fit(max1,base);
  // long hyphenated compounds (שְׁטְרָאוּס-עֲלִית) may break onto 2 lines at the hyphen, if that gives a bigger uniform size
  const fs2=hasSplit?fit(max2,Math.min(base,Math.max(40,(chh-reserve-20)/(1.6*2)))):0;
  SPLIT=fs2>fs1;FS=SPLIT?fs2:fs1;
}
let SPLIT=false;
// index of the syllable that ends with the hyphen/maqaf of a compound word (-1 = none)
function splitAt(w){for(let k=0;k<w.syl.length-1;k++)if(/[־-]$/.test(w.syl[k]))return k;return -1}
window.addEventListener('resize',()=>{if(W.length){FS=0;render()}});
function render(done){
  const w=W[wi];if(!w)return;
  if(!FS)computeFS();
  const stepSyl=(opts.mode==='tap'&&opts.syl)||opts.mode==='ai';
  let h=w.pre?`<span class="punct">${w.pre}</span>`:'';
  w.syl.forEach((s,k)=>{
    let cls='syl c'+(k%2);
    if(stepSyl)cls+=k<si?' past':k===si?' now':' fut';
    h+=`<span class="${cls}">${s}</span>`;
    if(SPLIT&&k===splitAt(w))h+='<span class="br"></span>';
  });
  if(w.post)h+=`<span class="punct">${w.post}</span>`;
  const el=$('word');el.innerHTML=h;el.classList.toggle('word-done',!!done);el.classList.toggle('split',SPLIT&&splitAt(w)>=0);
  // auto-fit
  if(!FS)computeFS();el.style.fontSize=FS+'px';
  // progress
  const pct=wi/W.length*100;$('fill').style.width=pct+'%';$('rocket').style.right=pct+'%';
  $('wcount').textContent=`מִלָּה ${wi+1} מִתּוֹךְ ${W.length}`;
  $('stars').textContent='⭐ '+stars;
  if(opts.ctx)renderCtx();
}
function renderCtx(){
  let s=wi;while(s>0&&!W[s-1].end)s--;let e=wi;while(e<W.length-1&&!W[e].end)e++;
  let h='';for(let i=s;i<=e;i++)h+=`<span class="w ${i<wi?'r':i===wi?'c':''}">${W[i].pre}${W[i].core}${W[i].post}</span> `;
  $('ctx').innerHTML=h;
}

// ---------- ADVANCE ----------
function nextStep(){
  const w=W[wi];if(!w)return;
  if(opts.mode==='tap'&&opts.syl&&si<w.syl.length-1){si++;render();tick(si);return}
  wordDone();
}
function prevStep(){
  if(opts.mode==='tap'&&opts.syl&&si>0){si--;render();return}
  if(wi>0){wi--;si=0;stars=Math.max(0,stars-1);render()}
}
let busy=false;
function wordDone(){
  if(busy)return;busy=true;
  stars++;render(true);$('word').classList.remove('pop');void $('word').offsetWidth;$('word').classList.add('pop');
  burst(6);ding();
  const n=wi+1;
  const milestone=n%10===0&&n<W.length;
  // panda only SPEAKS when an overlay takes the screen (start / milestone / finish). Mid-reading cheers + stuck hints are silent bubbles (Guy, Oct 24)
  cheerGap++;
  if(!milestone&&!talking&&(W[wi].end||cheerGap>=2+Math.floor(Math.random()*2))){cheerGap=0;pandaSay('cheer',null,true)}
  setTimeout(()=>{
    wi++;si=0;ai.burstWord=-1;lastAdvance=Date.now();$('help').classList.remove('nudge');busy=false;
    if(wi>=W.length){finish();return}
    if(milestone)bigCheer(n);
    render();
  },opts.mode==='mic'?350:450);
}

$('help').onclick=()=>{
  const w=W[wi];if(!w||!window.speechSynthesis)return;helpUsed++;
  const stepSyl=opts.mode==='tap'&&opts.syl;
  let t=stepSyl&&w.syl.length>1?w.syl[si]:w.core;
  const plainDigits=t.replace(/[\u0591-\u05C7]/g,'');
  speak(t);
};
let heVoice=null;
function loadVoices(){const v=speechSynthesis.getVoices();heVoice=v.find(x=>/^he|^iw/i.test(x.lang))||null;$('help').style.display=heVoice?'':'none';$('controls').classList.toggle('nohelp',!heVoice)}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}else{$('help').style.display='none';$('controls').classList.add('nohelp')}
function speak(t){const u=new SpeechSynthesisUtterance(t);u.lang='he-IL';if(heVoice)u.voice=heVoice;u.rate=.7;speechSynthesis.cancel();speechSynthesis.speak(u)}
let stuckSaid=-1;
setInterval(()=>{if(!$('s-read').classList.contains('on'))return;const idle=Date.now()-lastAdvance;
  if(idle>9000)$('help').classList.add('nudge');
  if(idle>12000&&stuckSaid!==wi&&!talking){stuckSaid=wi;pandaSay('stuck',null,true)}},1000);

// ---------- FX ----------
function cheer(t){const c=$('cheer');c.textContent=t;c.classList.add('show');clearTimeout(c._t);c._t=setTimeout(()=>c.classList.remove('show'),900)}
function burst(n){
  const r=$('card').getBoundingClientRect();
  for(let i=0;i<n;i++){
    const p=document.createElement('div');p.className='p';p.textContent=EMO[Math.floor(Math.random()*EMO.length)];
    const x=r.left+r.width/2,y=r.top+r.height/2;p.style.left=x+'px';p.style.top=y+'px';document.body.appendChild(p);
    const a=Math.random()*Math.PI*2,d=120+Math.random()*180;
    p.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d}px)) scale(1.3)`,opacity:0}],{duration:800+Math.random()*400,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>p.remove();
  }
}
function bigCheer(n){
  const [e,t0_]=BIG[Math.floor(n/10-1)%BIG.length];const t=typeof t0_==='string'?t0_:t0_[gnd()];const name=store.get('name','');
  $('big').querySelector('img').src='img/panda/'+['cheer','trophy','thumbs'][Math.floor(n/10-1)%3]+'.webp';
  $('big').querySelector('.t').textContent=t.replace('{n}',n)+' '+e;
  $('big').classList.add('on');
  pandaSay('milestone'); // speaks only while the overlay covers the screen
  $('big').querySelector('.sub').textContent=(name?name+', ':'')+vText('milestone',pandaSay.last);

  setTimeout(()=>$('big').classList.remove('on'),3300); // covers the spoken milestone line (<=2.9s)
}
$('big').onclick=()=>$('big').classList.remove('on');
$('intro').onclick=()=>{$('intro').classList.remove('on');lastAdvance=Date.now()};
$('scene').onclick=()=>{$('intro').classList.add('on')};

// ---------- SOUND ----------
let AC=null;function audioInit(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}AC&&AC.resume&&AC.resume()}
function tone(f,t0,d,type='sine',v=.15){if(!AC||!opts.snd)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime+t0);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t0+d);o.connect(g).connect(AC.destination);o.start(AC.currentTime+t0);o.stop(AC.currentTime+t0+d)}
function tick(k){tone(520+k*60,0,.08,'triangle',.08)}
function ding(){const b=660+(stars%5)*40;tone(b,0,.15);tone(b*1.5,.08,.25)}
function fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.3,'triangle',.18))}

// ---------- MIC ----------
let rec=null,micOn=false,consumed={};
function startMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){$('heard').textContent='הַמִּיקְרוֹפוֹן לֹא נִתְמָךְ בַּדַּפְדְּפָן הַזֶּה. אֶפְשָׁר לִלְחֹץ.';return}
  rec=new SR();rec.lang='he-IL';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=3;
  micOn=true;consumed={};$('mic').style.display='flex';
  rec.onresult=ev=>{
    for(let r=ev.resultIndex;r<ev.results.length;r++){
      const res=ev.results[r];
      // use best alternative, but accept a match from any alternative
      const alts=[...res].map(a=>a.transcript.trim().split(/\s+/));
      $('heard').textContent='🎧 '+res[0].transcript;
      let start=consumed[r]||0, toks=alts[0];
      if(talking||$('big').classList.contains('on')){consumed[r]=toks.length;continue} // ignore the panda's own voice / overlay time
      for(let j=start;j<toks.length;j++){
        if(!W[wi]||busy)break;
        if(matches(toks[j],W[wi])){consumed[r]=j+1;wordDone();}
        else if(W[wi+1]&&matches(toks[j],W[wi+1])&&W[wi].core.length<=4){consumed[r]=j+1;wi++;stars++;wordDone();} // skipped a tiny word
      }
      if((consumed[r]||0)===start){ // try alternatives on the last token
        for(const a of alts.slice(1)){const t=a[a.length-1];if(t&&W[wi]&&!busy&&matches(t,W[wi])){consumed[r]=Math.max(start,toks.length);wordDone();break}}
      }
    }
  };
  rec.onerror=e=>{if(e.error==='not-allowed'){$('heard').textContent='צָרִיךְ לְאַשֵּׁר מִיקְרוֹפוֹן 🎤';micOn=false}};
  rec.onend=()=>{consumed={};if(micOn&&$('s-read').classList.contains('on'))try{rec.start()}catch(e){}};
  try{rec.start()}catch(e){}
}
function stopMic(){micOn=false;if(rec)try{rec.stop()}catch(e){};$('mic').style.display='none'}

// ---------- AI MIC (server transcription) ----------
const API='https://nonrealistically-riotistic-jaunita.ngrok-free.dev/plugins/reading-buddy/transcribe';
// sound-alike letters (transcriber spells by sound): ט=ת, כ=ק=ח, ע=א, ב=ו, ס=שׂ ; drop silent א/ע/ה inside word
function phon(s){if(!s)return s;s=s.replace(/ט/g,'ת').replace(/[כח]/g,'ק').replace(/ע/g,'א').replace(/ס/g,'ש').replace(/ב/g,'ו');return s[0]+s.slice(1).replace(/[אה]/g,'')}
function looseMatch(tok,w){
  // strict: same first sound, similar length, small edit distance
  const h=phon(skel(tok));if(!h)return false;
  return targets(w).map(phon).some(t=>{if(!t)return false;if(h===t)return true;
    if(t.length<=2)return false;
    if(h[0]!==t[0])return false;
    if(Math.abs(h.length-t.length)>1)return false;
    const allow=t.length<=3?0:t.length<=5?1:2;return lev(h,t)<=allow});
}
let ai={on:false,stream:null,ctx:null,rec:null,chunks:[],speech:false,lastVoice:0,segStart:0,busy:0,raf:0};
function pickMime(){for(const m of['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'])if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m;return ''}
async function startAI(){
  if(!store.get('code','')){const c=prompt('קוד גישה (מגיא):');if(!c){$('heard').textContent='אֵין קוֹד, אֶפְשָׁר לִלְחֹץ 👆';return}store.set('code',c.trim())}
  try{ai.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
  catch(e){$('heard').textContent='צָרִיךְ לְאַשֵּׁר מִיקְרוֹפוֹן 🎤';return}
  ai.on=true;$('mic').style.display='flex';
  ai.ctx=new (window.AudioContext||window.webkitAudioContext)();
  const src=ai.ctx.createMediaStreamSource(ai.stream),an=ai.ctx.createAnalyser();an.fftSize=1024;src.connect(an);
  const buf=new Float32Array(an.fftSize);let noise=0.01;
  newRec();
  const loop=()=>{ if(!ai.on)return;
    an.getFloatTimeDomainData(buf);let s=0;for(const v of buf)s+=v*v;const rms=Math.sqrt(s/buf.length);
    const now=Date.now();
    if(!ai.speech)noise=noise*.98+rms*.02;
    const thr=Math.max(.015,noise*2.5);
    if(talking){ai.lastVoice=0;ai.speech=false;if(now-ai.segStart>300)cut(true);ai.raf=requestAnimationFrame(loop);return}
    if(rms>thr){
      if(now-ai.lastVoice>220&&ai.lastVoice&&W[wi]&&!busy){ // new voice burst = next syllable
        if(ai.burstWord!==wi){ai.burstWord=wi;si=0}else if(si<W[wi].syl.length-1)si++;
        render();tick(si);
      }
      ai.lastVoice=now;if(!ai.speech){ai.speech=true;$('mic').querySelector('.dot').style.background='#20b26b'}}
    if(ai.speech&&(now-ai.lastVoice>900||now-ai.segStart>8000)){ai.speech=false;$('mic').querySelector('.dot').style.background='';cut()}
    else if(!ai.speech&&now-ai.segStart>6000)cut(true); // drop silent audio
    ai.raf=requestAnimationFrame(loop)};
  loop();
}
function newRec(){
  const m=pickMime();ai.chunks=[];ai.segStart=Date.now();
  ai.rec=new MediaRecorder(ai.stream,m?{mimeType:m}:{});
  ai.rec.ondataavailable=e=>{if(e.data.size)ai.chunks.push(e.data)};
  ai.rec.start();
}
function cut(discard){
  const r=ai.rec,chunks=ai.chunks;
  r.onstop=()=>{if(!discard&&ai.on)sendSeg(new Blob(chunks,{type:r.mimeType||'audio/webm'}))};
  try{r.stop()}catch(e){}
  if(ai.on)newRec();
}
async function sendSeg(blob){
  if(blob.size<3000)return;
  const startWi=wi;const hint=W.slice(wi,wi+6).map(w=>w.core).join(' ');
  ai.busy++;$('heard').textContent='🎧 …';
  try{
    const r=await fetch(API,{method:'POST',body:blob,headers:{'Content-Type':blob.type,'X-RB-Code':store.get('code',''),'ngrok-skip-browser-warning':'1'}});
    if(r.status===401){store.set('code','');$('heard').textContent='הַקּוֹד לֹא נָכוֹן';return}
    const j=await r.json();const text=(j.text||'').trim();
    $('heard').textContent=text?'🎧 '+text:'';
    if(!text||wi!==startWi&&wi>startWi+6)return;
    const fresh=text.split(/[\s,.?!״"]+/).filter(Boolean);
    if(ai.carryWord!==wi)ai.carry=[];
    const toks=[...(ai.carry||[]),...fresh];const wBefore=wi;
    // consume tokens in order; also try joining neighbours (syllable-by-syllable reading)
    let j2=0;
    while(j2<toks.length&&W[wi]){
      let hit=0;
      for(let n=1;n<=3&&j2+n<=toks.length;n++){const parts=toks.slice(j2,j2+n);if(n>1&&parts.some(p=>skel(p).length>3))break;if(looseMatch(parts.join(''),W[wi])){hit=n;break}}
      if(!hit&&looseMatch(toks[j2],W[wi])) hit=1;
      if(hit){await doneAsync();j2+=hit;ai.carry=[]}else j2++;
    }
    // keep unmatched pieces for the same word (slow syllable reading split across pauses)
    if(wi===wBefore){ai.carry=toks.slice(-2).filter(t=>skel(t).length<=3);ai.carryWord=wi}else{ai.carry=[];ai.carryWord=-1}
  }catch(e){$('heard').textContent='אֵין חִבּוּר, אֶפְשָׁר לִלְחֹץ 👆'}
  finally{ai.busy--}
}
function doneAsync(){return new Promise(res=>{const go=()=>{if(busy)return setTimeout(go,60);wordDone();setTimeout(res,opts.mode==='ai'?380:0)};go()})}
function stopAI(){ai.on=false;cancelAnimationFrame(ai.raf);try{ai.rec&&ai.rec.state!=='inactive'&&ai.rec.stop()}catch(e){};ai.stream&&ai.stream.getTracks().forEach(t=>t.stop());ai.ctx&&ai.ctx.close();$('mic').style.display='none'}

// ---------- FINISH ----------
function finish(){
  stopMic();stopAI();$('scene').classList.remove('on');
  const secs=Math.round((Date.now()-t0)/1000);
  const best=store.get('best',{});const prev=best[bestKey(sel)];
  const rec={times:(prev?.times||0)+1,secs:prev?Math.min(prev.secs,secs):secs,last:secs};
  best[bestKey(sel)]=rec;store.set('best',best);
  const name=store.get('name','');
  const hist=store.get('hist',[]);hist.push({d:new Date().toISOString(),text:curText.id,part:sel,words:W.length,secs,help:helpUsed,mode:opts.mode});store.set('hist',hist.slice(-200));
  const streak=bumpStreak();store.set('xp',store.get('xp',0)+stars);
  $('end-title').textContent=(name?`${name}, `:'')+G('סִיַּמְתָּ! 🏆','סִיַּמְתְּ! 🏆');
  const mm=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  setTimeout(()=>{if(opts.snd){const k=prev&&secs<prev.last?'faster':'finish';const a=new Audio(vSrc(k,0));a.play().catch(()=>{})}},500);
  let s4;
  if(prev&&secs<prev.last)s4=['🚀',G('מָהִיר יוֹתֵר מִפַּעַם קוֹדֶמֶת!','מְהִירָה יוֹתֵר מִפַּעַם קוֹדֶמֶת!')];
  else if(prev)s4=['💪',G('כָּל קְרִיאָה מְחַזֶּקֶת אוֹתְךָ!','כָּל קְרִיאָה מְחַזֶּקֶת אוֹתָךְ!')];
  else s4=['🔥 '+streak,streak===1?'יוֹם רִאשׁוֹן בָּרֶצֶף!':'יָמִים בָּרֶצֶף!'];
  $('end-body').innerHTML=`<img class="tro" src="img/panda/trophy.webp" alt="">
    <div class="stats">
      <div class="stat green"><div class="v">${W.length}</div><div class="l">${G('מִלִּים קָרָאתָ','מִלִּים קָרָאת')}</div></div>
      <div class="stat gold"><div class="v">⭐ ${stars}</div><div class="l">כּוֹכָבִים</div></div>
      <div class="stat blue"><div class="v">${mm(secs)}</div><div class="l">זְמַן</div></div>
      <div class="stat"><div class="v">${s4[0]}</div><div class="l">${s4[1]}</div></div>
    </div>
    <div class="parent">לַהוֹרִים: זְמַן ${mm(secs)}${prev?` · פַּעַם קוֹדֶמֶת ${mm(prev.last)}`:''} · עֶזְרָה 🔈 ${helpUsed} · פַּעַם מִסְפָּר ${rec.times}</div>`;
  show('s-end');fanfare();setTimeout(()=>burst(30),200);setTimeout(()=>burst(30),700);
}
</script>
